[package]
name = "vox"
version = "0.1.0"
description = "Private, local voice-to-text for macOS"
authors = ["Vox contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/tapadar13/vox"

[lib]
name = "vox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["whisper-metal"]
whisper = ["dep:whisper-rs"]
whisper-metal = ["whisper", "whisper-rs/metal"]
parakeet = ["dep:sherpa-rs"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.18.2"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
ringbuf = "0.5.1"
rubato = "5.0.0"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sherpa-rs = { version = "0.6.8", optional = true }
tauri = { version = "2.11.5", features = ["macos-private-api", "image-png", "tray-icon", "tracing"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = { version = "2.9.0", features = ["tracing"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
whisper-rs = { version = "0.16.0", optional = true, features = ["tracing_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[dev-dependencies]
tempfile = "3.27.0"
