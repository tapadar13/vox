<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="100" y1="80" x2="920" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17142f"/>
      <stop offset="0.48" stop-color="#0d0f1b"/>
      <stop offset="1" stop-color="#06070d"/>
    </linearGradient>
    <linearGradient id="wave" x1="270" y1="300" x2="760" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9AEFF"/>
      <stop offset="0.48" stop-color="#806BFF"/>
      <stop offset="1" stop-color="#5AE2BC"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="halo"/>
      <feColorMatrix in="halo" values="0.5 0 0 0 0.35 0 0.35 0 0 0.25 0 0 1 0 0.85 0 0 0 0.8 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="28" y="28" width="968" height="968" rx="205" fill="none" stroke="white" stroke-opacity="0.09" stroke-width="8"/>
  <g filter="url(#glow)" fill="url(#wave)">
    <rect x="238" y="438" width="68" height="148" rx="34"/>
    <rect x="350" y="342" width="68" height="340" rx="34"/>
    <rect x="462" y="250" width="100" height="524" rx="50"/>
    <rect x="606" y="342" width="68" height="340" rx="34"/>
    <rect x="718" y="438" width="68" height="148" rx="34"/>
  </g>
  <circle cx="512" cy="512" r="325" fill="none" stroke="white" stroke-opacity="0.055" stroke-width="3"/>
</svg>
